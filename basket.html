<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سلة التسوق - أمازون جازان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-main"><div class="logo" onclick="location.href='index.html'"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"></div></div>
    </header>

    <div class="container" style="display: grid; grid-template-columns: 3fr 1fr; gap: 20px;">
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
            <h2>عربة التسوق</h2>
            <div id="cartContainer"></div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; height: fit-content;">
            <p>المجموع الحقيقي: <br><b style="font-size:24px; color:#B12704;" id="totalReal">0</b> ريال</p>
            <button class="btn-amazon" onclick="alert('شكراً لطلبك!')">إتمام الدفع</button>
        </div>
    </div>

    <script>
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cartContainer');
            let sum = 0;

            if(cart.length === 0) {
                container.innerHTML = "<h4>السلة فارغة</h4>";
                document.getElementById('totalReal').innerText = "0";
                return;
            }

            container.innerHTML = cart.map((item, i) => {
                sum += item.price;
                return `<div style="display:flex; gap:15px; padding:15px; border-bottom:1px solid #eee;">
                    <img src="${item.img}" width="80">
                    <div style="flex:1;"><h4>${item.name}</h4><button onclick="del(${i})">حذف</button></div>
                    <b>${item.price} ريال</b>
                </div>`;
            }).join('');

            document.getElementById('totalReal').innerText = sum;
        }
        function del(i) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(i,1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
        }
        loadCart();
    </script>
</body>
</html>
