<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سلة التسوق - أمازون جازان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-main">
            <div class="logo" onclick="window.location.href='index.html'">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon Logo">
            </div>
            <div style="flex-grow: 1; text-align: center;"><h2>عربة التسوق</h2></div>
        </div>
    </header>

    <div class="container">
        <div style="display: grid; grid-template-columns: 3fr 1fr; gap: 20px; margin-top: 30px;">
            
            <div style="background: white; padding: 25px; border-radius: 8px; border: 1px solid #ddd;">
                <h2 style="border-bottom: 1px solid #eee; padding-bottom: 15px;">عربة التسوق</h2>
                <div style="display: flex; gap: 25px; padding: 25px 0; border-bottom: 1px solid #f3f3f3; align-items: center;">
                    <img src="https://m.media-amazon.com/images/I/61f43c3P6dL._AC_SL1500_.jpg" width="130">
                    <div style="flex-grow: 1;">
                        <h3 style="color: #007185;">آيفون 16 برو - النسخة الأحدث</h3>
                        <p style="color: green; font-size: 14px; margin-top: 5px;">متوفر في المخزون</p>
                        <p style="font-size: 13px; color: #555;">مؤهل للشحن المجاني لطلاب جامعة جازان</p>
                        <button style="background: none; border: none; color: #007185; cursor: pointer; margin-top: 10px;">حذف من السلة</button>
                    </div>
                    <div style="font-weight: bold; font-size: 22px; color: #B12704;">4,299 ريال</div>
                </div>
            </div>

            <div style="background: white; padding: 25px; border-radius: 8px; border: 1px solid #ddd; height: fit-content;">
                <p style="font-size: 19px; margin-bottom: 20px;">المجموع الفرعي (1 منتج): <b>4,299 ريال</b></p>
                <div style="margin-bottom: 20px;">
                    <input type="checkbox"> <small>هذا الطلب يحتوي على هدية</small>
                </div>
                <button class="btn-amazon" onclick="window.location.href='checkout.html'" style="font-size: 16px; padding: 12px;">
                    تابع عملية الشراء
                </button>
            </div>
        </div>
    </div>

    <footer class="amazon-footer">
        <div class="footer-bottom">© 2026، أمازون جازان - مشروع الطالب حسام</div>
    </footer>
</body>
</html>
