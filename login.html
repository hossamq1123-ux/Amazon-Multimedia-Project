<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: white; text-align: center; padding-top: 60px;">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" width="130" style="cursor: pointer;" onclick="location.href='index.html'">
    
    <div id="loginBox" style="width: 360px; border: 1px solid #ddd; padding: 35px; margin: 30px auto; border-radius: 8px; text-align: right;">
        <h2 id="title">تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" style="width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #888; border-radius: 3px;">
        <button class="btn-amazon" onclick="login()">استمرار</button>
        <p style="font-size: 12px; margin-top: 20px;">بالاستمرار، أنت توافق على شروط أمازون جازان.</p>
    </div>

    <div id="regSec">
        <p style="color: #767676; font-size: 12px;">جديد في أمازون؟</p>
        <button onclick="showReg()" style="width: 360px; padding: 8px; margin-top: 10px; border: 1px solid #adb1b8; background: #e7e9ec; border-radius: 3px; cursor: pointer;">أنشئ حسابك الجديد</button>
    </div>

    <script>
        function login() {
            localStorage.setItem('isLoggedIn', 'true');
            alert('أهلاً بك يا حسام! تم تسجيل الدخول.');
            location.href = 'index.html';
        }
        function showReg() {
            document.getElementById('title').innerText = "إنشاء حساب جديد";
            document.getElementById('regSec').style.display = 'none';
            alert('يمكنك الآن إدخال بيانات حسابك الجديد.');
        }
    </script>
</body>
</html>
