<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" width="110" style="margin-bottom: 25px; cursor: pointer;" onclick="location.href='index.html'">
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        <form action="index.html">
            <label style="font-size: 13px; font-weight: bold;">البريد الإلكتروني</label>
            <input type="email" style="width: 100%; padding: 8px; margin: 8px 0 15px 0; border: 1px solid #888; border-radius: 3px;" required>
            <button class="btn-amazon" type="submit">استمرار</button>
        </form>
        <p style="font-size: 12px; margin-top: 20px; line-height: 1.4;">بالاستمرار، فإنك توافق على شروط استخدام أمازون جازان وخصوصية الموقع.</p>
    </div>
    <p style="margin-top: 20px; font-size: 12px; color: #767676;">جديد على أمازون؟</p>
    <button style="width: 350px; padding: 7px; margin-top: 10px; border: 1px solid #adb1b8; background: #e7e9ec; border-radius: 3px; cursor: pointer;">أنشئ حسابك الجديد</button>
    
    <footer class="amazon-footer" style="width: 100%; margin-top: auto;">
        <div class="footer-bottom">© 2026، أمازون جازان - مشروع المجموعة رقم 1</div>
    </footer>
</body>
</html>
