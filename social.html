<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمازون جازان - روابط التواصل</title>
    <style>
        /* ==========================================================================
           1. إعدادات الصفحة والخلفية (متناسقة مع ألوان أمازون جازان الفخمة)
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            /* خلفية متدرجة بألوان الهوية لأمازون (الكحلي والأسود) مع صورة خلفية خفيفة للتسوق */
            background: linear-gradient(rgba(19, 25, 33, 0.85), rgba(35, 47, 62, 0.95)), 
                        url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* ==========================================================================
           2. الهيدر والشعار الخاص بمتجرك (Profile Section)
           ========================================================================== */
        .profile-container {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        /* الشعار الدائري الخاص بأمازون بإطار ذهبي أنيق (Orange Amazon) */
        .profile-logo {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #febd69;
            background-color: #131921;
            object-fit: contain;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .profile-logo:hover {
            transform: scale(1.05);
        }

        .profile-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            color: white;
        }

        .profile-subtitle {
            font-size: 1.1rem;
            color: #febd69; /* اللون البرتقالي المميز لأمازون */
            max-width: 400px;
            margin: 0 auto;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            font-weight: 500;
        }

        /* ==========================================================================
           3. حاوية الأزرار وتأثير الزجاج الضبابي الشفاف (Glassmorphism)
           ========================================================================== */
        .links-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 40px;
        }

        /* نفس التأثير الزجاجي الشفاف المطلوب في الصورة تماماً */
        .social-link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* حركة سلسة ولون ذهبي خفيف عند تمرير الماوس فوق الزر */
        .social-link-btn:hover {
            background: rgba(254, 189, 105, 0.2); /* تلميح باللون البرتقالي لأمازون عند الهافر */
            border-color: var(--orange);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(254, 189, 105, 0.2);
        }

        .social-link-btn:active {
            transform: translateY(-1px);
        }

        .icon {
            font-size: 1.3rem;
        }

        /* ==========================================================================
           4. تذييل الصفحة الخاص بمشروعك (Footer Section)
           ========================================================================== */
        .social-footer {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" class="profile-logo" alt="أمازون جازان" onclick="location.href='index.html'">
        <h1 class="profile-title">أمازون جازان</h1>
        <p class="profile-subtitle">مشروع المجموعة رقم 1 - جامعة جازان</p>
    </div>

    <div class="links-wrapper">
        <a href="index.html" class="social-link-btn">
            <span class="icon">🛒</span> المتجر الرئيسي
        </a>
        
        <a href="departments.html" class="social-link-btn">
            <span class="icon">📦</span> تصفح الأقسام
        </a>
        
        <a href="basket.html" class="social-link-btn">
            <span class="icon">🛍️</span> عربة التسوق الحالية
        </a>
        
        <a href="media.html" class="social-link-btn">
            <span class="icon">🎬</span> الوسائط والإعلانات
        </a>
        
        <a href="https://wa.me/966500000000" target="_blank" class="social-link-btn">
            <span class="icon">📞</span> الدعم الفني (واتساب)
        </a>
    </div>

    <footer class="social-footer">
        جميع الحقوق محفوظة لأمازون جازان © 2026 <br>
        تصميم وبرمجة المجموعة رقم 1
    </footer>

</body>
</html>
