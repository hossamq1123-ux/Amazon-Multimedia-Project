<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-main">
            <div class="logo" onclick="location.href='index.html'"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg"></div>
        </div>
        <nav class="nav-links"><a href="index.html">العودة للرئيسية</a></nav>
    </header>

    <div class="container">
        <h1 style="text-align: center; margin-bottom: 30px;">إعلان iPhone 16 Pro الرسمي</h1>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <iframe style="position: absolute; top:0; left: 0; width: 100%; height: 100%; border:0;" 
                src="https://www.youtube.com/embed/GDlkCkcIqTs?autoplay=1&mute=1&playlist=GDlkCkcIqTs&loop=1" 
                allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
            <div class="product-card" style="text-align: center;">
                <img src="https://m.media-amazon.com/images/I/61f43c3P6dL._AC_SL1500_.jpg" style="height: 400px;">
                <h2>آيفون 16 برو الجديد</h2>
                <p class="price">4,299 ريال</p>
                <button class="btn-amazon">اطلب الآن</button>
            </div>
            <div style="background: white; padding: 40px; border-radius: 15px; border: 1px solid #ddd;">
                <h3>أبرز المميزات:</h3>
                <ul style="margin: 20px; line-height: 2.5; font-size: 18px;">
                    <li>شريحة A18 Pro المتطورة</li>
                    <li>زر التحكم في الكاميرا الجديد</li>
                    <li>تصميم من التيتانيوم الخفيف</li>
                    <li>أطول عمر بطارية في آيفون</li>
                </ul>
            </div>
        </div>
    </div>

    <footer class="amazon-footer">
        <div class="footer-bottom"><p>© 2026، أمازون جازان - مشروع حسام</p></div>
    </footer>
</body>
</html>
