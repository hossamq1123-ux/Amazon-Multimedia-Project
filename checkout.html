<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تفاصيل الدفع - أمازون جازان</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .payment-body { background-color: #fffaf2; display: flex; justify-content: center; padding: 40px; }
        .payment-card { background: #fffaf2; width: 100%; max-width: 450px; padding: 30px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #8b7355; font-weight: bold; }
        .input-group input, select { width: 100%; padding: 12px; border: none; border-radius: 10px; background: white; }
        .confirm-btn { background-color: #76c91d; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body class="payment-body">
    <div class="payment-card">
        <h2 style="text-align: center; margin-bottom: 30px;">تفاصيل الدفع</h2>
        <div class="input-group"><label>الاسم الكامل</label><input type="text" placeholder="أدخل اسمك الكامل"></div>
        <div class="input-group"><label>عنوان التوصيل</label><input type="text" placeholder="المدينة، الحي، الشارع"></div>
        <div class="input-group"><label>رقم الجوال</label><input type="text" placeholder="05xxxxxxxx"></div>
        <div class="input-group">
            <label>طريقة الدفع</label>
            <select><option>مدى / فيزا</option><option>الدفع عند الاستلام</option></select>
        </div>
        <div style="margin: 20px 0; border-top: 1px solid #ddd; padding-top: 20px;">
            <p style="font-size: 1.5rem; font-weight: bold;">الإجمالي: 4299 ريال</p>
        </div>
        <button class="confirm-btn" onclick="alert('تم الطلب!'); location.href='index.html'">تأكيد الطلب والدفع</button>
    </div>
</body>
</html>
