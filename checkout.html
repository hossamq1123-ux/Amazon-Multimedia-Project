<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الشراء - أمازون جازان</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="payment-body">

    <div class="payment-card">
        <div class="logo" style="text-align: center; margin-bottom: 20px;" onclick="location.href='index.html'">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" width="100" style="cursor:pointer;">
        </div>
        
        <h2 style="text-align: center; color: #232f3e; margin-bottom: 25px;">تفاصيل الشراء والدفع</h2>
        
        <div style="background: white; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <p style="font-size: 16px; color: #555;">المبلغ الإجمالي المطلوب دفعه:</p>
            <b style="font-size: 26px; color: #B12704;" id="checkoutTotal">0</b> <b style="color: #B12704;">ريال</b>
        </div>

        <form id="paymentForm" onsubmit="processPayment(event)">
            <div class="input-group">
                <label>اسم حامل البطاقة</label>
                <input type="text" required placeholder="حسام ...">
            </div>
            
            <div class="input-group">
                <label>رقم البطاقة</label>
                <input type="text" maxlength="16" required placeholder="xxxx xxxx xxxx xxxx">
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="input-group">
                    <label>تاريخ الانتهاء</label>
                    <input type="text" placeholder="MM/YY" required>
                </div>
                <div class="input-group">
                    <label>الرمز السري (CVV)</label>
                    <input type="password" maxlength="3" placeholder="xxx" required>
                </div>
            </div>

            <button type="submit" class="confirm-btn">تأكيد ودفع المبلغ</button>
        </form>
    </div>

    <script>
        function displayCheckoutAmount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            let total = 0;
            
            cart.forEach(item => {
                total += item.price;
            });
            
            document.getElementById('checkoutTotal').innerText = total.toLocaleString();
        }

        function processPayment(event) {
            event.preventDefault(); 
            
            alert('تمت عملية الدفع بنجاح! شكراً لتسوقك من أمازون جازان.');
            
            localStorage.removeItem('cart');
            
            location.href = 'index.html';
        }

        window.onload = displayCheckoutAmount;
    </script>
</body>
</html>
