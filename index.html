<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أمازون جازان - الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-main">
            <div class="logo" onclick="location.href='index.html'">
                <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon">
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="ابحث عن آيفون، كتب، إلكترونيات...">
                <button class="search-btn">🔍</button>
            </div>
            <div class="user-nav">
                <small>مرحباً، حسام</small>
                <div style="font-weight: bold;">الحساب والقوائم</div>
            </div>
        </div>
        <nav class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="departments.html">الأقسام</a>
            <a href="basket.html">السلة</a>
            <a href="social.html">التواصل الاجتماعي</a>
        </nav>
    </header>

    <div class="container">
        <div id="categories-container"></div>
    </div>

    <footer class="amazon-footer">
        <div class="footer-bottom">
            <p>© 2026، أمازون جازان - مشروع الطالب حسام - جامعة جازان</p>
        </div>
    </footer>

    <script>
        // بيانات حقيقية 100% مع صور مباشرة تعمل
        const productsDB = [
            { id: 1, cat: "الكتب", name: "كتاب أساسيات PHP الحديثة", price: 120, img: "https://m.media-amazon.com/images/I/51E6v8vKstL.jpg", desc: "تعلم بناء المواقع باستخدام PHP 8 و MySQL بشكل احترافي." },
            { id: 2, cat: "الكتب", name: "رواية عالم صوفي - جوستاين غاردر", price: 65, img: "https://m.media-amazon.com/images/I/81A+X50bExL.jpg", desc: "واحدة من أشهر الروايات الفلسفية التي تُرجمت لأكثر من 60 لغة." },
            { id: 3, cat: "الهواتف", name: "iPhone 16 Pro Max - تيتانيوم", price: 5699, img: "https://m.media-amazon.com/images/I/61H7R9uI7LL._AC_SL1500_.jpg", desc: "أحدث معالج A18 Pro، شاشة 6.9 بوصة، ونظام كاميرات سينمائي." },
            { id: 4, cat: "الهواتف", name: "Samsung Galaxy S24 Ultra", price: 4499, img: "https://m.media-amazon.com/images/I/71WetsS696L._AC_SL1500_.jpg", desc: "كاميرا 200 ميجابكسل مع دعم كامل للذكاء الاصطناعي وقلم S-Pen." },
            { id: 5, cat: "الألعاب", name: "Sony PlayStation 5 Slim", price: 2149, img: "https://m.media-amazon.com/images/I/41m7G7769LL._AC_SL1000_.jpg", desc: "النسخة الجديدة الأنحف، سعة 1 تيرا، تدعم دقة 4K ومعدل 120 إطار." },
            { id: 6, cat: "الألعاب", name: "Nintendo Switch OLED - أبيض", price: 1399, img: "https://m.media-amazon.com/images/I/61m9v64N7PL._AC_SL1500_.jpg", desc: "شاشة OLED زاهية 7 بوصة وألوان غنية جداً." },
            { id: 7, cat: "الإلكترونيات", name: "TCL 65 Inch 4K Google TV", price: 1999, img: "https://m.media-amazon.com/images/I/71rI74D5fPL._AC_SL1500_.jpg", desc: "شاشة ذكية فائقة الوضوح بدقة 4K مع تقنية HDR10." },
            { id: 8, cat: "الإلكترونيات", name: "Apple MacBook Air M3", price: 4899, img: "https://m.media-amazon.com/images/I/71jG+e7roXL._AC_SL1500_.jpg", desc: "معالج M3 الجبار، بطارية تدوم 18 ساعة، وتصميم نحيف جداً." }
        ];

        const order = ["الكتب", "الهواتف", "الألعاب", "الإلكترونيات"];
        const container = document.getElementById('categories-container');

        order.forEach(catName => {
            const section = document.createElement('div');
            section.className = 'category-section';
            section.innerHTML = `<h2 class="section-title">${catName}</h2>`;
            
            // شبكة المنتجات (اثنين اثنين بجانب بعض)
            const grid = document.createElement('div');
            grid.className = 'product-grid-two-cols';

            const filtered = productsDB.filter(p => p.cat === catName);
            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="goToDetails(${p.id})">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                        <div class="product-info">
                            <h4>${p.name}</h4>
                            <p class="price">${p.price} ريال</p>
                            <button class="btn-amazon">عرض التفاصيل والمواصفات</button>
                        </div>
                    </div>
                `;
            });
            section.appendChild(grid);
            container.appendChild(section);
        });

        function goToDetails(id) {
            const product = productsDB.find(p => p.id === id);
            localStorage.setItem('selectedProduct', JSON.stringify(product));
            window.location.href = 'details.html';
        }
    </script>
</body>
</html>
