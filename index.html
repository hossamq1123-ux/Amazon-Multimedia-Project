<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>متجر أمازون الحديث</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" style="color: white; font-weight: bold; font-size: 1.5rem;">AMAZON <span style="color:var(--amazon-orange)">MODERN</span></div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="departments.html">الأقسام</a>
            <a href="basket.html">السلة</a>
            <a href="contact.html">الدعم الفني</a>
            <a href="login.html">دخول</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 2rem;">أحدث المنتجات المختارة</h2>
        <div class="product-grid" id="product-container"></div>
    </div>

    <script>
        const products = [
            { name: "آيفون 15 برو مكس", price: 4200, img: "https://images.unsplash.com/photo-1696446701796-da61225697cc?w=500", cat: "هواتف" },
            { name: "كتاب مقدمة في البرمجة", price: 85, img: "https://images.unsplash.com/photo-1512428559087-560fa5ceab42?w=500", cat: "كتب" },
            { name: "بلاي ستيشن 5", price: 2100, img: "https://images.unsplash.com/photo-1606144042614-b2417e99c4e3?w=500", cat: "ألعاب" },
            { name: "سماعات سوني عازلة للضجيج", price: 1100, img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500", cat: "إلكترونيات" },
            { name: "ساعة آبل الجيل التاسع", price: 1600, img: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500", cat: "منتجات رقمية" },
            { name: "رواية أنتيخريستوس", price: 45, img: "https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=500", cat: "كتب" },
            { name: "سيارة أطفال لاسلكية", price: 350, img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=500", cat: "ألعاب أطفال" },
            // ... (سيتم تكرار هذه المصفوفة برمجياً لتصل لـ 50 منتج متنوع)
        ];

        const container = document.getElementById('product-container');
        
        // توليد 50 منتج بناءً على النماذج أعلاه
        for(let i=0; i<50; i++) {
            const p = products[i % products.length];
            container.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}&sig=${i}" alt="${p.name}">
                    <div class="product-info">
                        <small style="color:gray">${p.cat}</small>
                        <h4>${p.name}</h4>
                        <p class="price">${p.price} ريال</p>
                        <button class="btn-add" onclick="alert('تمت الإضافة للسلة')">إضافة للسلة</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
