<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أمازون - جامعة جازان</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .product-card { background: white; border: 1px solid #ddd; padding: 15px; text-align: center; border-radius: 8px; }
        .product-card img { width: 100%; height: 150px; object-fit: contain; }
        .price { color: #B12704; font-weight: bold; font-size: 1.2em; }
        .category-tag { background: #eee; font-size: 0.8em; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <img src="https://pngimg.com/uploads/amazon/amazon_PNG11.png" width="80">
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="departments.html">الأقسام</a>
            <a href="basket.html">السلة (<span id="cart-count">0</span>)</a>
            <a href="login.html">دخول</a>
        </nav>
    </header>

    <div class="container">
        <h2>اكتشف أكثر من 50 منتجاً جديداً</h2>
        <div class="product-grid" id="main-grid">
            </div>
    </div>

    <script>
        const categories = ["كتب", "هواتف", "ألعاب أطفال", "منتجات رقمية"];
        const grid = document.getElementById('main-grid');
        let cartCount = 0;

        // توليد 50 منتج عشوائي
        for (let i = 1; i <= 50; i++) {
            const cat = categories[Math.floor(Math.random() * categories.length)];
            const productHTML = `
                <div class="product-card">
                    <img src="https://picsum.photos/200/200?random=${i}" alt="منتج">
                    <span class="category-tag">${cat}</span>
                    <h4>منتج رقم ${i}</h4>
                    <p class="price">${Math.floor(Math.random() * 500) + 50} ريال</p>
                    <button onclick="addToCart()">أضف للسلة</button>
                </div>
            `;
            grid.innerHTML += productHTML;
        }

        function addToCart() {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert("تم إضافة المنتج للسلة بنجاح!");
        }
    </script>
</body>
</html>
